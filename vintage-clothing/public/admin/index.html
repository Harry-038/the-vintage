<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — The Vintage Clothing Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand">The Vintage Clothing<small>SHOP DASHBOARD</small></div>
    <nav id="side-nav">
      <a href="#dashboard" data-role="owner">Dashboard</a>
      <a href="#products" data-role="owner">Catalog &amp; Inventory</a>
      <a href="#orders" data-role="any">Orders &amp; Shipping</a>
      <a href="#returns" data-role="owner">Returns &amp; Refunds</a>
      <a href="#customers" data-role="owner">Customers (CRM)</a>
      <a href="#marketing" data-role="owner">Coupons &amp; Banners</a>
      <a href="#import" data-role="owner">Bulk Import/Export</a>
      <a href="#staff" data-role="owner">Staff Access</a>
    </nav>
    <div class="who" id="who-box"></div>
  </aside>
  <main class="admin-main">
    <section id="sec-dashboard" class="section"></section>
    <section id="sec-products" class="section"></section>
    <section id="sec-orders" class="section"></section>
    <section id="sec-returns" class="section"></section>
    <section id="sec-customers" class="section"></section>
    <section id="sec-marketing" class="section"></section>
    <section id="sec-import" class="section"></section>
    <section id="sec-staff" class="section"></section>
  </main>
</div>
<script src="/admin/js/app.js"></script>
</body>
</html>
