<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Owner Login — The Vintage Clothing</title>
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="card" style="width:100%;max-width:360px;">
    <div style="font-family:'Fraunces',serif;font-size:19px;margin-bottom:4px;">The Vintage Clothing</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:22px;">Shop dashboard — Sangrur, Punjab</div>
    <form id="login-form">
      <div class="field"><label>Username</label><input name="username" required autofocus /></div>
      <div class="field"><label>Password</label><input name="password" type="password" required /></div>
      <div id="err"></div>
      <button class="btn brass" style="width:100%;justify-content:center;" type="submit">Sign in</button>
    </form>
    <p style="font-size:11.5px;color:var(--muted);margin-top:16px;">Demo logins — Owner: <code>owner / vintage123</code> &middot; Staff: <code>packing / packing123</code></p>
  </div>
<script>
qs = (s) => document.querySelector(s);
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') }),
      credentials: 'same-origin',
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    location.href = '/admin/index.html';
  } catch (err) {
    qs('#err').innerHTML = `<div class="notice err">${err.message}</div>`;
  }
});
</script>
</body>
</html>
